<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Debate Brawl - O Jogo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #111; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    
    #game-container { position: relative; width: 100%; max-width: 800px; height: 450px; background: #000; border: 2px solid #fff; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }

    /* HUD e Telas */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 10; }
    .hidden { display: none !important; }

    h1 { font-size: 2rem; margin-bottom: 20px; color: #ffd700; text-shadow: 2px 2px #ff0000; text-align: center; }
    .btn { padding: 12px 24px; font-size: 1.1rem; background: #28a745; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin: 8px; font-weight: bold; }
    .btn:active { background: #1e7e34; }
    .btn-secondary { background: #007bff; }

    /* Seleção de Personagens */
    .char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .char-card { padding: 12px; background: #222; border: 2px solid #555; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; }
    .char-card.selected { border-color: #ffd700; background: #444; }

    /* Controles do Celular */
    #mobile-controls { position: absolute; bottom: 10px; left: 0; width: 100%; height: 120px; display: flex; justify-content: space-between; padding: 0 15px; pointer-events: none; z-index: 5; }
    .dpad, .actions { pointer-events: auto; display: flex; gap: 5px; }
    .dpad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 40px); }
    .ctrl-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.3); border: 1px solid #fff; border-radius: 8px; color: #fff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    .ctrl-btn:active { background: rgba(255,255,255,0.7); color: #000; }
    .btn-attack { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,0,0,0.5); font-weight: bold; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <!-- Tela Inicial -->
  <div id="start-screen" class="screen">
    <h1>DEBATE BRAWL 2026</h1>
    <button class="btn" onclick="goToSelect('CPU')">Jogar contra CPU</button>
    <button class="btn btn-secondary" onclick="goToSelect('LOCAL')">Jogar Local (2 Players)</button>
  </div>

  <!-- Tela de Seleção -->
  <div id="select-screen" class="screen hidden">
    <h2 id="select-title" style="margin-bottom:15px;">Escolha o Jogador 1</h2>
    <div class="char-grid" id="char-grid"></div>
    <div>
      <button class="btn btn-secondary" onclick="selectRandom()">Aleatório 🎲</button>
      <button class="btn" id="btn-confirm" onclick="confirmSelection()" disabled>Confirmar</button>
    </div>
  </div>

  <!-- Controles Touch para Mobile -->
  <div id="mobile-controls">
    <div class="dpad">
      <div></div>
      <div class="ctrl-btn" id="btn-up">▲</div>
      <div></div>
      <div class="ctrl-btn" id="btn-left">◄</div>
      <div class="ctrl-btn" id="btn-down">▼</div>
      <div class="ctrl-btn" id="btn-right">►</div>
    </div>
    <div class="actions">
      <div class="ctrl-btn btn-attack" id="btn-atk">GOLPE</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Dados dos Personagens
const CHARACTERS = [
  { id: 'patria', name: 'Capitão Pátria', color: '#ffd700', suitColor: '#002244', hasSash: true },
  { id: 'janjo', name: 'Janjo', color: '#ff2222', suitColor: '#cc0000', hasStar: true },
  { id: 'renan', name: 'Renan Rolo', color: '#ffee00', suitColor: '#ddaa00', throwsNotebook: true },
  { id: 'vendedor', name: 'Vendedor de Sonhos', color: '#a020f0', suitColor: '#4b0082', aura: true }
];

// 4 Cenários
const STAGES = [
  { name: 'Debate na TV', bg: '#1a1a3a', label: 'ESTÚDIO AO VIVO' },
  { name: 'Feed de Redes Sociais', bg: '#000000', label: '#TRENDING_TOPICS' },
  { name: 'Auditório Público', bg: '#2d3748', label: 'AUDITÓRIO PRINCIPAL' },
  { name: 'Estúdio de Podcast', bg: '#3a1a1a', label: 'LIVESTREAM' }
];

let mode = 'CPU';
let currentSelectionStage = 1;
let p1Char = null, p2Char = null;
let currentStage = STAGES[0];

let gameState = 'MENU';
let keys = {};
let touchState = { left: false, right: false, up: false, down: false, atk: false };

let projectiles = [];

// Objetos dos Jogadores
let player1 = { x: 150, y: 300, vx: 0, vy: 0, w: 40, h: 80, hp: 100, crouching: false, attacking: false, facing: 1, char: null };
let player2 = { x: 610, y: 300, vx: 0, vy: 0, w: 40, h: 80, hp: 100, crouching: false, attacking: false, facing: -1, char: null };

function goToSelect(selectedMode) {
  mode = selectedMode;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
  renderCharGrid();
}

function renderCharGrid() {
  const grid = document.getElementById('char-grid');
  grid.innerHTML = '';
  CHARACTERS.forEach((c) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerText = c.name;
    card.onclick = () => {
      document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
      card.classList.add('selected');
      if (currentSelectionStage === 1) p1Char = c;
      else p2Char = c;
      document.getElementById('btn-confirm').disabled = false;
    };
    grid.appendChild(card);
  });
}

function selectRandom() {
  const rand = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  if (currentSelectionStage === 1) p1Char = rand;
  else p2Char = rand;
  confirmSelection();
}

function confirmSelection() {
  if (currentSelectionStage === 1) {
    if (mode === 'CPU') {
      p2Char = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      startGame();
    } else {
      currentSelectionStage = 2;
      document.getElementById('select-title').innerText = 'Escolha o Jogador 2';
      document.getElementById('btn-confirm').disabled = true;
      document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
    }
  } else {
    startGame();
  }
}

function startGame() {
  document.getElementById('select-screen').classList.add('hidden');
  player1.char = p1Char;
  player2.char = p2Char;
  currentStage = STAGES[Math.floor(Math.random() * STAGES.length)];
  
  player1.hp = 100; player1.x = 150;
  player2.hp = 100; player2.x = 610;
  projectiles = [];
  
  gameState = 'PLAYING';
}

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); touchState[key] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); touchState[key] = false; });
  el.addEventListener('mousedown', () => touchState[key] = true);
  el.addEventListener('mouseup', () => touchState[key] = false);
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-atk', 'atk');

canvas.addEventListener('click', () => {
  if (gameState === 'PLAYING') executeAttack(player1);
});

function executeAttack(p) {
  if (p.attacking) return;
  p.attacking = true;

  if (p.char.throwsNotebook) {
    projectiles.push({
      x: p.facing === 1 ? p.x + p.w : p.x - 20,
      y: p.y + 20,
      vx: p.facing * 8,
      owner: p
    });
  }

  setTimeout(() => p.attacking = false, 250);
}

function update() {
  if (gameState !== 'PLAYING') return;

  // Controles P1
  const p1Left = keys['KeyA'] || touchState.left;
  const p1Right = keys['KeyD'] || touchState.right;
  const p1Up = keys['KeyW'] || touchState.up;
  const p1Down = keys['KeyS'] || touchState.down;
  const p1Atk = keys['Space'] || touchState.atk;

  if (p1Left) player1.vx = -4;
  else if (p1Right) player1.vx = 4;
  else player1.vx = 0;

  if (p1Up && player1.y >= 300) player1.vy = -12;
  player1.crouching = p1Down;
  if (p1Atk) executeAttack(player1);

  // Controles P2 / CPU
  if (mode === 'LOCAL') {
    if (keys['ArrowLeft']) player2.vx = -4;
    else if (keys['ArrowRight']) player2.vx = 4;
    else player2.vx = 0;

    if (keys['ArrowUp'] && player2.y >= 300) player2.vy = -12;
    player2.crouching = keys['ArrowDown'];
    if (keys['Enter']) executeAttack(player2);
  } else {
    if (player2.x > player1.x + 70) player2.vx = -2;
    else if (player2.x < player1.x - 70) player2.vx = 2;
    else player2.vx = 0;

    if (Math.abs(player2.x - player1.x) < 120 && Math.random() < 0.03) {
      executeAttack(player2);
    }
  }

  // Física
  [player1, player2].forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.6;

    if (p.y >= 300) { p.y = 300; p.vy = 0; }
    if (p.x < 10) p.x = 10;
    if (p.x > 750) p.x = 750;
  });

  player1.facing = player1.x < player2.x ? 1 : -1;
  player2.facing = player2.x < player1.x ? 1 : -1;

  // Projéteis (Caderno do Renan Rolo)
  projectiles.forEach((proj, idx) => {
    proj.x += proj.vx;
    let target = proj.owner === player1 ? player2 : player1;
    if (
      proj.x < target.x + target.w &&
      proj.x + 15 > target.x &&
      proj.y < target.y + target.h &&
      proj.y + 15 > target.y
    ) {
      target.hp = Math.max(0, target.hp - 8);
      projectiles.splice(idx, 1);
    } else if (proj.x < 0 || proj.x > 800) {
      projectiles.splice(idx, 1);
    }
  });

  checkHit(player1, player2);
  checkHit(player2, player1);
}

function checkHit(attacker, defender) {
  if (attacker.attacking && !attacker.char.throwsNotebook) {
    let range = attacker.char.aura ? 45 : 30;
    let atkX = attacker.facing === 1 ? attacker.x + attacker.w : attacker.x - range;
    if (
      atkX < defender.x + defender.w &&
      atkX + range > defender.x &&
      attacker.y < defender.y + defender.h &&
      attacker.y + attacker.h > defender.y
    ) {
      defender.hp = Math.max(0, defender.hp - 1.2);
    }
  }
}

function draw() {
  ctx.fillStyle = currentStage.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#fff";
  ctx.font = "14px Arial";
  ctx.fillText("CENÁRIO: " + currentStage.label, 20, 30);

  ctx.fillStyle = "#333";
  ctx.fillRect(0, 380, canvas.width, 70);

  if (gameState !== 'PLAYING') {
    requestAnimationFrame(renderLoop);
    return;
  }

  drawFighter(player1);
  drawFighter(player2);

  // Desenhar projéteis (Caderno)
  ctx.fillStyle = "#fff";
  projectiles.forEach(p => {
    ctx.fillRect(p.x, p.y, 15, 12);
    ctx.fillStyle = "#000";
    ctx.fillText("📖", p.x, p.y + 10);
  });

  drawHUD();

  if (player1.hp <= 0 || player2.hp <= 0) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffd700";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    let winner = player1.hp > 0 ? player1.char.name : player2.char.name;
    ctx.fillText(winner + " VENCEU O DEBATE!", canvas.width / 2, canvas.height / 2);
  }
}

function drawFighter(p) {
  let h = p.crouching ? p.h / 2 : p.h;
  let y = p.crouching ? p.y + p.h / 2 : p.y;

  // Aura do Vendedor de Sonhos
  if (p.char.aura) {
    ctx.fillStyle = "rgba(160, 32, 240, 0.3)";
    ctx.beginPath();
    ctx.arc(p.x + p.w / 2, y + h / 2, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  // Traje / Corpo
  ctx.fillStyle = p.char.suitColor;
  ctx.fillRect(p.x, y, p.w, h);

  // Detalhe: Estrela do Janjo
  if (p.char.hasStar) {
    ctx.fillStyle = "#fff";
    ctx.font = "12px Arial";
    ctx.fillText("★", p.x + 15, y + 25);
  }

  // Detalhe: Faixa do Capitão Pátria
  if (p.char.hasSash) {
    ctx.fillStyle = "#00ff00";
    ctx.fillRect(p.x + 5, y + 10, 30, 8);
  }

  // Cabeça
  ctx.fillStyle = p.char.color;
  ctx.fillRect(p.x + 5, y - 20, 30, 20);

  // Golpe corporal
  if (p.attacking && !p.char.throwsNotebook) {
    ctx.fillStyle = "#ffff00";
    let atkX = p.facing === 1 ? p.x + p.w : p.x - 30;
    ctx.fillRect(atkX, y + 10, 30, 15);
  }
}

function drawHUD() {
  ctx.fillStyle = "#555";
  ctx.fillRect(20, 40, 200, 20);
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(20, 40, player1.hp * 2, 20);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "left";
  ctx.fillText(player1.char.name, 20, 35);

  ctx.fillStyle = "#555";
  ctx.fillRect(580, 40, 200, 20);
  ctx.fillStyle = "#00ff00";
  ctx.fillRect(580, 40, player2.hp * 2, 20);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText(player2.char.name, 780, 35);
}

function renderLoop() {
  
  update();
  draw();
  requestAnimationFrame(renderLoop);
}

requestAnimationFrame(renderLoop);
</script>
</body>
</html>
